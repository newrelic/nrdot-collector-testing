suite: test daemonset
templates:
  - daemonset.yaml
tests:
  - it: should create a DaemonSet when mode is daemonset
    set:
      mode: daemonset
      configMap:
        existingName: test-configmap
    asserts:
      - isKind:
          of: DaemonSet
      - equal:
          path: metadata.name
          value: RELEASE-NAME-collector

  - it: should use the correct image
    set:
      mode: daemonset
      configMap:
        existingName: test-configmap
      image:
        repository: custom/collector
        tag: "1.2.3"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: custom/collector:1.2.3

  - it: should reference the existing ConfigMap with default key
    set:
      mode: daemonset
      configMap:
        existingName: my-config
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: my-config
      - equal:
          path: spec.template.spec.volumes[0].configMap.items[0].key
          value: config.yaml
      - equal:
          path: spec.template.spec.volumes[0].configMap.items[0].path
          value: config.yaml

  - it: should reference the existing ConfigMap with custom key
    set:
      mode: daemonset
      configMap:
        existingName: my-config
        key: relay
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: my-config
      - equal:
          path: spec.template.spec.volumes[0].configMap.items[0].key
          value: relay
      - equal:
          path: spec.template.spec.volumes[0].configMap.items[0].path
          value: config.yaml

  - it: should apply pod labels
    set:
      mode: daemonset
      configMap:
        existingName: test-configmap
      podLabels:
        app: collector
        version: v1
    asserts:
      - equal:
          path: spec.template.metadata.labels.app
          value: collector
      - equal:
          path: spec.template.metadata.labels.version
          value: v1

  - it: should set resources when provided
    set:
      mode: daemonset
      configMap:
        existingName: test-configmap
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 128Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 200m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 256Mi
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 100m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 128Mi

  - it: should set extraArgs when provided
    set:
      mode: daemonset
      configMap:
        existingName: test-configmap
      extraArgs:
        - "--log-level=debug"
        - "--feature-gates=test"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args[0]
          value: "--log-level=debug"
      - equal:
          path: spec.template.spec.containers[0].args[1]
          value: "--feature-gates=test"

  - it: should set extraEnvs when provided
    set:
      mode: daemonset
      configMap:
        existingName: test-configmap
      extraEnvs:
        - name: MY_VAR
          value: "my-value"
        - name: SECRET_VAR
          valueFrom:
            secretKeyRef:
              name: my-secret
              key: secret-key
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: MY_VAR
      - equal:
          path: spec.template.spec.containers[0].env[0].value
          value: "my-value"
      - equal:
          path: spec.template.spec.containers[0].env[1].name
          value: SECRET_VAR

  - it: should set extraVolumes and extraVolumeMounts when provided
    set:
      mode: daemonset
      configMap:
        existingName: test-configmap
      extraVolumes:
        - name: extra-config
          configMap:
            name: extra-configmap
      extraVolumeMounts:
        - name: extra-config
          mountPath: /etc/extra
          readOnly: true
    asserts:
      - equal:
          path: spec.template.spec.volumes[1].name
          value: extra-config
      - equal:
          path: spec.template.spec.volumes[1].configMap.name
          value: extra-configmap
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].name
          value: extra-config
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].mountPath
          value: /etc/extra

  - it: should fail when configMap.existingName is not set
    set:
      mode: daemonset
    asserts:
      - failedTemplate:
          errorMessage: "configMap.existingName is required"

  - it: should not add telemetrygen containers by default
    set:
      mode: daemonset
      configMap:
        existingName: test-configmap
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
      - equal:
          path: spec.template.spec.containers[0].name
          value: collector

  - it: should use the correct telemetrygen image
    set:
      mode: daemonset
      configMap:
        existingName: test-configmap
      telemetrygen:
        image:
          repository: custom/telemetrygen
          tag: "1.2.3"
        signals:
          traces:
    asserts:
      - equal:
          path: spec.template.spec.containers[1].image
          value: custom/telemetrygen:1.2.3

  - it: should add a telemetrygen container for each configured signal
    set:
      mode: daemonset
      configMap:
        existingName: test-configmap
      telemetrygen:
        signals:
          metrics:
          logs:
          traces:
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 4
      - contains:
          path: spec.template.spec.containers
          content:
            name: telemetrygen-logs
          any: true
      - contains:
          path: spec.template.spec.containers
          content:
            name: telemetrygen-metrics
          any: true
      - contains:
          path: spec.template.spec.containers
          content:
            name: telemetrygen-traces
          any: true

  - it: should only add telemetrygen containers for the configured signals
    set:
      mode: daemonset
      configMap:
        existingName: test-configmap
      telemetrygen:
        signals:
          traces:
            extraArgs:
              - --rate=5
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 2
      - equal:
          path: spec.template.spec.containers[1].name
          value: telemetrygen-traces

  - it: should derive defaults for a signal with no configuration
    set:
      mode: daemonset
      configMap:
        existingName: test-configmap
      telemetrygen:
        signals:
          traces:
    asserts:
      - equal:
          path: spec.template.spec.containers[1].args
          value:
            - traces
            - --otlp-endpoint=localhost:4317
            - --otlp-attributes=service.name="telemetrygen-traces"
            - --rate=10
            - --duration=5m

  - it: should use the http endpoint when protocol is http
    set:
      mode: daemonset
      configMap:
        existingName: test-configmap
      telemetrygen:
        signals:
          metrics:
            protocol: http
    asserts:
      - equal:
          path: spec.template.spec.containers[1].args
          value:
            - metrics
            - --otlp-http
            - --otlp-endpoint=localhost:4318
            - --otlp-attributes=service.name="telemetrygen-metrics"
            - --rate=10
            - --duration=5m

  - it: should default to the grpc endpoint when protocol is grpc
    set:
      mode: daemonset
      configMap:
        existingName: test-configmap
      telemetrygen:
        signals:
          metrics:
            protocol: grpc
    asserts:
      - equal:
          path: spec.template.spec.containers[1].args
          value:
            - metrics
            - --otlp-endpoint=localhost:4317
            - --otlp-attributes=service.name="telemetrygen-metrics"
            - --rate=10
            - --duration=5m

  - it: should add a default body for logs only
    set:
      mode: daemonset
      configMap:
        existingName: test-configmap
      telemetrygen:
        signals:
          logs:
    asserts:
      - equal:
          path: spec.template.spec.containers[1].args
          value:
            - logs
            - --otlp-endpoint=localhost:4317
            - --otlp-attributes=service.name="telemetrygen-logs"
            - --rate=10
            - --duration=5m
            - --body=short log

  - it: should append extraArgs after the derived defaults
    set:
      mode: daemonset
      configMap:
        existingName: test-configmap
      telemetrygen:
        signals:
          traces:
            protocol: http
            extraArgs:
              - --rate=50
              - --otlp-endpoint=collector.example:9999
    asserts:
      - equal:
          path: spec.template.spec.containers[1].args
          value:
            - traces
            - --otlp-http
            - --otlp-endpoint=localhost:4318
            - --otlp-attributes=service.name="telemetrygen-traces"
            - --rate=10
            - --duration=5m
            - --rate=50
            - --otlp-endpoint=collector.example:9999
