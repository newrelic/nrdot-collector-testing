name: E2E Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Validate telemetrygen, collector and weaver interoperability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: 'v3.19.2'

      - name: Create cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: telemetrygen-test

      - name: Create basic collector config
        run: |
          cat <<'EOF' > /tmp/config.yaml
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
          exporters:
            debug:
              verbosity: detailed
            otlp:
              endpoint: 127.0.0.1:5123
              compression: none
              tls:
                insecure: true
          service:
            pipelines:
              metrics:
                receivers: [otlp]
                exporters: [debug, otlp]
              logs:
                receivers: [otlp]
                exporters: [debug]
              traces:
                receivers: [otlp]
                exporters: [debug]
          EOF
          kubectl create configmap collector-config --from-file=config.yaml=/tmp/config.yaml

      - name: Create weaver test registry
        run: |
          mkdir -p /tmp/registry
          # matches telemetrygen's defaults
          cat <<'EOF' > /tmp/registry/registry.yaml
          groups:
            - id: registry.service
              type: attribute_group
              brief: "Service attributes."
              attributes:
                - id: service.name
                  type: string
                  stability: stable
                  brief: "Logical name of the service."
                  examples: ["telemetrygen-metrics"]

            - id: metric.gen
              type: metric
              metric_name: gen
              stability: stable
              brief: "telemetrygen's default gauge."
              instrument: gauge
              unit: ""
          EOF
          kubectl create configmap weaver-registry --from-file=/tmp/registry

      - name: Install chart
        run: |
          helm install telemetrygen-test helm/collector \
            --set mode=deployment \
            --set configMap.existingName=collector-config \
            --set 'extraArgs[0]=--config=/etc/otelcol/config.yaml' \
            --set weaver.registry.existingName=weaver-registry \
            --set-json 'telemetrygen.signals={"metrics":{},"logs":{},"traces":{"extraArgs":["--rate=5"]}}' \
            --set-json 'telemetrygen.signals.metrics.extraArgs=["--otlp-attributes=service.name=\"override-works\""]' \
            --wait --timeout 3m

      - name: Port-forward weaver admin port
        run: kubectl port-forward deploy/telemetrygen-test-collector 4320:4320 &

      - name: Wait for telemetry to arrive
        run: sleep 45

      - name: Stop weaver and fetch report
        run: curl -sS --fail-with-body -X POST http://localhost:4320/stop | jq . > /tmp/report.json

      - name: Assert telemetrygen signals (metrics, logs, traces) reached the collector
        run: |
          logs=$(kubectl logs -l app.kubernetes.io/name=collector -c collector --tail=-1)
          failed=0
          for signal in metrics logs traces; do
            if echo "$logs" | grep -q "\"otelcol.signal\": \"${signal}\""; then
              echo "ok: $signal received"
            else
              echo "FAIL: no $signal in collector logs"
              failed=1
            fi
          done
          exit $failed

      - name: Assert telemetrygen extraArgs override defaults
        run: |
          failed=0
          if ! kubectl logs -l app.kubernetes.io/name=collector -c telemetrygen-traces --tail=-1 | grep -q '"per-second": 5'; then
            echo "FAIL: telemetrygen-traces did not resolve rate to 5"
            failed=1
          fi
          if ! kubectl logs -l app.kubernetes.io/name=collector -c collector --tail=-1 | grep -q "override-works"; then
            echo "FAIL: no override-works service.name in collector logs"
            failed=1
          fi
          exit $failed

      - name: Assert full weaver coverage and no violations
        run: |
          jq -e '.statistics.registry_coverage >= 1.0' /tmp/report.json
          jq -e '(.statistics.advice_level_counts.violation // 0) == 0' /tmp/report.json

      - name: Dump state on failure
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe pods -l app.kubernetes.io/name=collector
          kubectl logs -l app.kubernetes.io/name=collector --all-containers --prefix --tail=100
